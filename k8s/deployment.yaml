apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-next
  namespace: demo
  labels:
    app: demo-next
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-next
  template:
    metadata:
      labels:
        app: demo-next
    spec:
      containers:
        - name: demo-next
                    image: 10.151.1.171/demo/demo-next:be49c74c2f95a4434fd8efa1c869f435c1bc6ad0
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"